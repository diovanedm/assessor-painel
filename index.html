<style>
:root{
  --bg:#E8EBEF; --panel:#F5F6F8; --raise:#FFFFFF; --ink:#13161B; --ink2:#4B515C; --ink3:#848A95; --line:#D2D7DE; --line2:#DFE3E8;
  --signal:#2B45FF; --signal-soft:rgba(43,69,255,.14); --on-ink:#F5F6F8;
  --ok:#12895A; --warn:#B87C00; --alert:#D3363C; --idle:#959BA6;
  --a-financas:#D19C00; --a-saude:#14874D; --a-ingles:#0A8FCA; --a-trabalho:#E5531C; --a-carreira:#4252C2;
  --a-emocional:#7380CF; --a-casa-familia:#D0616D; --a-cultura:#8E31AA; --a-eu:#848A95; --a-pessoal:#848A95;
  --f-ui:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-dot:"Doto", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 50px -24px rgba(20,24,40,.28);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#17191D; --panel:#1F2226; --raise:#25282D; --ink:#ECEEF1; --ink2:#B2B8C2; --ink3:#7C8390; --line:#31353C; --line2:#2A2D33;
  --signal:#8291FF; --signal-soft:rgba(130,145,255,.18); --on-ink:#17191D;
  --ok:#3CC48A; --warn:#E5B03A; --alert:#F0676C; --idle:#6E7581;
  --a-financas:#EFBF2C; --a-saude:#3DBB78; --a-ingles:#3CB6EA; --a-trabalho:#FF7A45; --a-carreira:#7F8DF2;
  --a-emocional:#A3AEF0; --a-casa-familia:#F08C96; --a-cultura:#C36EDF; --a-eu:#7C8390; --a-pessoal:#7C8390;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 50px -24px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───── barra do topo ───── */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px clamp(14px,3vw,32px);padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.brand svg{width:26px;height:26px}
.find{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 12px;border-radius:12px;background:var(--panel);color:var(--ink3);min-width:min(320px,38vw);font-size:14px}
.find kbd{margin-left:auto;font:500 12px var(--f-ui);color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.find svg,.ib svg{width:18px;height:18px;flex:none}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.ib:hover{background:var(--panel);color:var(--ink)}
.ib[aria-pressed="true"]{color:var(--signal)}
.live{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.live b{font-weight:600;color:var(--ink)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);position:relative;flex:none}
.live .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--signal);opacity:0;animation:ping 2.4s ease-out infinite}
.live.saving .dot{background:var(--warn)} .live.saving .dot::after{border-color:var(--warn);animation-duration:1s}
.live.err .dot{background:var(--alert)} .live.err .dot::after{animation:none}
.live.idle .dot{background:var(--idle)} .live.idle .dot::after{animation:none}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(1.6);opacity:0}}

/* ───── estrutura ───── */
.wrap{display:grid;grid-template-columns:minmax(330px,392px) minmax(0,1fr);gap:clamp(22px,3vw,44px);padding:6px clamp(14px,3vw,32px) 80px;max-width:1520px;margin:0 auto}
.instrument{position:sticky;top:70px;align-self:start;background:var(--panel);border-radius:30px;padding:20px 22px 24px;max-height:calc(100vh - 84px);overflow:auto;scrollbar-width:thin;box-shadow:var(--shadow)}
.content{min-width:0;display:grid;gap:46px;align-content:start;padding-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}
.sec{border-radius:18px}
.sec>header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
h2{font-size:21px;line-height:1.2;font-weight:650;letter-spacing:-.015em;margin:0}
h3{font-size:14px;font-weight:600;margin:22px 0 6px;color:var(--ink2)}
.count{font:900 19px/1 var(--f-dot);color:var(--ink3);letter-spacing:.04em}
.hint{font-size:13px;color:var(--ink3);margin:8px 0 0}
.muted{color:var(--ink3)}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,25%{background:var(--signal-soft);box-shadow:0 0 0 12px var(--signal-soft)}100%{background:transparent;box-shadow:0 0 0 12px transparent}}
.instrument.flash{animation-name:flashi}
@keyframes flashi{0%,25%{box-shadow:0 0 0 3px var(--signal),var(--shadow)}100%{box-shadow:0 0 0 3px transparent,var(--shadow)}}

/* ───── instrumento: mostrador do dia ───── */
.dial{position:relative;width:100%;max-width:322px;margin:4px auto 6px;aspect-ratio:1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .tk{stroke:var(--ink3);stroke-width:1;opacity:.55}
.dial .tk.mj{stroke-width:1.6;opacity:.9}
.dial .hl{fill:var(--ink3);font:600 10px var(--f-ui);text-anchor:middle;dominant-baseline:central}
.dial .trk{fill:none;stroke:var(--line);stroke-width:3}
.dial .exp{fill:none;stroke:var(--ink3);stroke-width:3;opacity:.45}
.dial .elp{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dial .ev{fill:none;stroke-width:9;stroke-linecap:round}
.dial .ev.past{opacity:.28}
.dial .ev.cur{stroke-width:12}
.dial .hand{stroke:var(--signal);stroke-width:1.5;opacity:.55}
.dial .now{fill:var(--signal)}
.dial .halo{fill:none;stroke:var(--signal);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.clock{font:900 clamp(40px,4.2vw,50px)/1 var(--f-dot);letter-spacing:.02em;color:var(--ink)}
.clock .col{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.dial-date{margin-top:8px;font-size:13px;color:var(--ink2)}
.greet{font-size:23px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:14px 0 6px}
.summary{margin:0;color:var(--ink2);font-size:15px}
.summary b{color:var(--ink);font-weight:650}
.summary .late{color:var(--alert)}
.next{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--raise);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.next .k{color:var(--ink3);flex:none}
.next b{font-weight:650}

.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;min-height:42px}
.tl li:last-child{border-bottom:0}
.tl .t{color:var(--ink2);font-size:13px;line-height:1.25}
.tl .t small{display:block;color:var(--ink3);font-size:11.5px}
.tl .n{display:flex;gap:8px;align-items:center;min-width:0}
.tl .n span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tl .sw{width:8px;height:8px;border-radius:3px;flex:none;background:var(--c,var(--ink3))}
.tl li.past .n{color:var(--ink3)}
.tl li.cur{background:linear-gradient(90deg,var(--signal-soft),transparent 70%);border-radius:10px;border-bottom-color:transparent;padding-left:8px;margin-left:-8px}
.tl li.nowline{min-height:0;padding:0;border:0;grid-template-columns:52px 1fr;color:var(--signal);font-size:12px;font-weight:600}
.tl li.nowline::after{content:"";height:1.5px;background:var(--signal);border-radius:2px;align-self:center}
.hb{display:flex;gap:6px}
.hb button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--ink2)}
.hb button:hover{border-color:var(--ink2);color:var(--ink)}
.hb button svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.no{background:color-mix(in srgb,var(--alert) 13%,transparent);color:var(--alert)}
.why{display:flex;gap:6px;grid-column:1/-1}
.why input{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:0 10px;font-size:14px}
.btn{height:34px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;background:var(--ink);color:var(--on-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.week{list-style:none;margin:6px 0 0;padding:0}
.week li{display:grid;grid-template-columns:76px 48px 1fr;gap:8px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line2)}
.week li:last-child{border-bottom:0}
.week .d{color:var(--ink2)} .week .h{color:var(--ink3)}
.instrument h3{margin-top:24px}

/* ───── tarefas ───── */
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{height:32px;padding:0 11px;border-radius:9px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.tabs button span{font-weight:600;opacity:.75}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:start}
.chk{width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.6px solid var(--ink3);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.chk svg{width:13px;height:13px;opacity:0;color:var(--on-ink);transition:opacity .15s}
.chk:hover{border-color:var(--ink)}
.task.done .chk{background:var(--ink);border-color:var(--ink)}
.task.done .chk svg{opacity:1}
.task.done .tx>.t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.task.busy .chk{animation:busy 1s ease-in-out infinite}
@keyframes busy{50%{transform:scale(.82)}}
.tx{min-width:0}
.tx>.t{font-size:15px;line-height:1.4;overflow-wrap:anywhere}

function parseFile(path, sha, text) {
  const fm = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const meta = {};
  let body = text;
  if (fm) {
    body = text.slice(fm[0].length);
    for (const l of fm[1].split(/\r?\n/)) {
      const m = l.match(/^([\w-]+):\s*(.*)$/);
      if (!m) continue;
      let v = m[2].trim();
      if (v.startsWith('[') && v.endsWith(']')) v = v.slice(1, -1).split(',').map(x => x.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      else v = v.replace(/^["']|["']$/g, '');
      meta[m[1]] = v;
    }
  }
  const stem = path.split('/').pop().replace(/\.md$/, '');
  const tm = body.match(/^#\s+(.+)$/m);
  const title = tm ? tm[1].trim() : stem;
  let area = areaKey(meta.area || '');
  const ma = path.match(/^areas\/([^/]+)\//);
  if (ma && (!area || !AREAS[area])) area = ma[1];
  if (!area) area = 'eu';
  const sens = SENS.has(area) || path === 'eu/como-funciono.md';
  const tasks = [];
  const lines = text.split('\n');
  let h2 = '', h3 = '', fence = false;
  for (const l of lines) {
    if (/^\s*```/.test(l)) { fence = !fence; continue; }
    if (fence) continue;
    let m;
    if ((m = l.match(/^(#{2,3})\s+(.*)$/))) { if (m[1] === '##') { h2 = m[2].trim(); h3 = ''; } else h3 = m[2].trim(); continue; }
    if ((m = l.match(TASK_RE))) tasks.push(mkTask(l, m, h2, h3));
  }
  return { path, sha, text, meta, body, stem, title, area, sens, tasks, _n: null };
}
function mkTask(raw, m, h2, h3) {
  const r = m[3];
  return {
    raw, checked: m[2] !== ' ', h2, h3,
    due: (r.match(/📅\s*(\d{4}-\d{2}-\d{2})/) || [])[1] || null,
    done: (r.match(/✅\s*(\d{4}-\d{2}-\d{2})/) || [])[1] || null,
    id: (r.match(/🆔\s*(\S+)/) || [])[1] || null,
    prio: /⏫/.test(r) ? 'alta' : /🔽/.test(r) ? 'baixa' : null,
    text: cleanTask(r),
  };
}
const cleanTask = t => t.replace(/\s*📅\s*\d{4}-\d{2}-\d{2}/g, '').replace(/\s*✅\s*\d{4}-\d{2}-\d{2}/g, '').replace(/\s*🆔\s*\S+/g, '')
  .replace(/\s*[⏫🔼🔽]️?/gu, '').replace(/\s*·\s*(pedido feito\s*)?\d{4}-\d{2}-\d{2}.*$/, '').trim();
const taskCore = l => cleanTask(l.replace(TASK_RE, '$3'));

function cells(l) { return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()); }
const isSep = l => /^\|\s*:?-{3,}/.test(l.trim());

function parseAgenda(text) {
  const series = [], events = [];
  let sec = '';
  const today = now();
  for (const l of (text || '').split('\n')) {
    const m = l.match(/^##\s+(.+)$/);
    if (m) { sec = norm(m[1]); continue; }
    if (!l.trim().startsWith('|') || isSep(l)) continue;
    const c = cells(l);
    if (sec.startsWith('series fixas') && c.length >= 3 && norm(c[0]) !== 'dia') {
      const s = parseSerie(c, today);
      if (s) series.push(s);
    } else if (sec.startsWith('compromissos') && /^\d{4}-\d{2}-\d{2}/.test(c[0])) {
      const tm = parseHora(c[1]);
      events.push({ date: c[0].slice(0, 10), ...tm, name: c[2] || '', area: areaKey(c[3] || ''), areaTxt: c[3] || '', obs: c[4] || '' });
    }
  }
  return { series, events };
}
function parseHora(s) {
  const r = (s || '').match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);
  if (r) return { start: pad5(r[1]), end: pad5(r[2]), allDay: false };
  const one = (s || '').match(/(\d{1,2}:\d{2})/);
  if (one) return { start: pad5(one[1]), end: pad5(minToHm(toMin(one[1]) + 30)), allDay: false };
  return { start: null, end: null, allDay: true };
}
const pad5 = s => s.length === 4 ? '0' + s : s;
const minToHm = m => `${pad(Math.floor(Math.min(m, 1439) / 60))}:${pad(Math.min(m, 1439) % 60)}`;
function parseSerie(c, today) {
  const spec = norm(c[0]);
  const days = {};
  const md = spec.match(/^dia (\d+)/);
  if (md) days.mday = +md[1];
  else {
    const idx = { dom: 0, seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6 };
    const set = new Set();
    for (const part of spec.split(/\s+e\s+|,\s*/)) {
      const r = part.split(/\s*[–-]\s*/).map(x => x.trim().slice(0, 3));
      if (r.length === 2 && r[0] in idx && r[1] in idx) { let i = idx[r[0]]; for (let g = 0; g < 7; g++) { set.add(i); if (i === idx[r[1]]) break; i = (i + 1) % 7; } }
      else if (r[0] in idx) set.add(idx[r[0]]);
    }
    if (!set.size) return null;
    days.dows = set;
  }
  const tm = parseHora(c[1]);
  let ev = c[2] || '';
  let from = null;
  const fm = ev.match(/,?\s*a partir de (\d{1,2})\/(\d{1,2})/i);
  if (fm) {
    let y = today.getFullYear();
    let d = new Date(y, +fm[2] - 1, +fm[1]);
    if (d < addDays(today, -180)) d = new Date(y + 1, +fm[2] - 1, +fm[1]);
    from = ymd(d);
    ev = ev.replace(fm[0], '').trim();
  }
  let area = '', name = ev;
  const pm = ev.match(/^(.+?)\s+·\s+(.+)$/);
  if (pm && areaKey(pm[1]) && AREAS[areaKey(pm[1])]) { area = areaKey(pm[1]); name = pm[2]; }
  const until = ((c[3] || '').match(/^\d{4}-\d{2}-\d{2}/) || [])[0] || null;
  return { days, ...tm, name, area, from, until, kind: 'serie' };
}
function seriesOn(dateStr) {

  return S.agenda.series.filter(s => {
    if (s.from && dateStr < s.from) return false;
    if (s.until && dateStr > s.until) return false;

}
function parseHabits(text) {
  const out = [];
  for (const l of (text || '').split('\n')) {
    if (!l.startsWith('|') || isSep(l)) continue;
    const c = cells(l);
    const dm = (c[0] || '').match(/^\d{4}-\d{2}-\d{2}/);
    if (!dm) continue;
    out.push({ raw: l, date: dm[0], oque: c[1] || '', area: areaKey(c[2] || ''), ok: (c[3] || '').includes('✅') ? true : (c[3] || '').includes('❌') ? false : null, motivo: c[4] || '' });
  }

}
function parseInbox(f) {
  if (!f) return [];
  return f.body.split('\n').filter(l => /^- (?!\[)/.test(l)).map(raw => {
    const m = raw.match(/^- (\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?\s*(?:—|-|:)?\s*(.*)$/);
    return m ? { raw, date: m[1], time: m[2] || '', text: m[3] } : { raw, date: '', time: '', text: raw.slice(2) };
  });

function reindex() {
  S.stems = {};
  for (const p in S.files) S.stems[S.files[p].stem.toLowerCase()] = p;
  const groups = new Map();
  for (const p in S.files) {
    if (p === COMPRAS) continue;
    const f = S.files[p];
    for (const t of f.tasks) {
      const key = t.id ? 'id:' + t.id : p + '\n' + t.raw;
      let g = groups.get(key);
      if (!g) { g = { key, text: t.text, due: t.due, done: t.done, prio: t.prio, checked: true, sens: false, area: f.area, members: [] }; groups.set(key, g); }
      g.members.push({ path: p, raw: t.raw });
      g.checked = g.checked && t.checked;
      g.sens = g.sens || f.sens;
      if (!g.due && t.due) g.due = t.due;
      if (t.done && (!g.done || t.done > g.done)) g.done = t.done;
    }
  }
  S.tasks = [...groups.values()];
  const cf = S.files[COMPRAS];
  const secs = [], hoje = [], today = ymd(now());
  if (cf) {
    for (const t of cf.tasks) {
      if (norm(t.h2).startsWith('comprar') && !t.checked) {
        let s = secs.find(x => x.name === t.h3);
        if (!s) secs.push(s = { name: t.h3 || 'Outro', items: [] });
        s.items.push(t);
      } else if (t.checked && t.done === today) hoje.push(t);
    }
  }
  S.compras = { secs, hoje, heads: cf ? [...cf.text.matchAll(/^###\s+(.+)$/gm)].map(m => m[1].trim()) : [] };
  S.agenda = parseAgenda(S.files['agenda.md']?.text);
  S.habits = parseHabits(S.files['eu/habitos.md']?.text);
  S.inbox = parseInbox(S.files['inbox.md']);
  S.name = S.files['eu/perfil.md']?.title || '';
}

/* ─────────────── GitHub ─────────────── */
function erro(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
async function gh(path, { method = 'GET', body, etag } = {}) {
  const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token };
  if (etag) headers['If-None-Match'] = etag;
  if (body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch { throw erro('offline'); }
  if (r.status === 304) return { status: 304, ok: false };
  let json = null;
  try { json = await r.json(); } catch { }
  if (r.status === 401) throw erro('token');
  if ((r.status === 403 || r.status === 429) && r.headers.get('x-ratelimit-remaining') === '0') {
    S.rateReset = (+r.headers.get('x-ratelimit-reset') || 0) * 1000;
    throw erro('rate');
  }
  return { status: r.status, ok: r.ok, json, etag: r.headers.get('etag') };
}
const repoPath = p => p.split('/').map(encodeURIComponent).join('/');
function b64dec(s) { const bin = atob(String(s).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function b64enc(str) { const u = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); }
async function getBlob(sha) {
  const c = LS.raw(K + 'b.' + sha);
  if (c != null) return c;
  const r = await gh(`/repos/${cfg.repo}/git/blobs/${sha}`);
  if (!r.ok) throw erro('http', 'blob ' + r.status);
  const t = b64dec(r.json.content);
  LS.put(K + 'b.' + sha, t);
  return t;
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } }));
}
function saveSnap() {
  const files = {};
  for (const p in S.files) files[p] = S.files[p].sha;
  LS.set(K + 'snap', { repo: cfg.repo, head: S.head, files, commits: S.commits.slice(0, 20) });
}
function loadSnap() {
  const s = LS.get(K + 'snap', null);
  if (!s || s.repo !== cfg.repo) return false;
  for (const p in s.files) { const t = LS.raw(K + 'b.' + s.files[p]); if (t != null) S.files[p] = parseFile(p, s.files[p], t); }
  S.head = s.head; S.commits = s.commits || [];
  return Object.keys(S.files).length > 0;
}
function gcBlobs() {
  const keep = new Set(Object.values(S.files).map(f => K + 'b.' + f.sha));
  for (const k of LS.keys()) if (k.startsWith(K + 'b.') && !keep.has(k)) LS.del(k);
}

async function sync(force = false) {
  if (S.syncing || !cfg.token) return;
  S.syncing = true; S.lastTry = Date.now(); setLive();
  const t0 = Date.now();
  const done = () => { S.err = null; S.lastSync = Date.now(); };
  try {
    if (!cfg.branch) {
      const r = await gh(`/repos/${cfg.repo}`);
      if (r.status === 404) throw erro('notfound');
      if (!r.ok) throw erro('http', 'repo ' + r.status);
      cfg.branch = r.json.default_branch || 'main'; saveCfg();
    }
    const ref = await gh(`/repos/${cfg.repo}/git/ref/heads/${encodeURIComponent(cfg.branch)}`, { etag: force ? null : S.etag });
    if (ref.status === 304) { done(); return; }
    if (ref.status === 404) throw erro('notfound');
    if (!ref.ok) throw erro('http', 'ref ' + ref.status);
    S.etag = ref.etag;
    const sha = ref.json.object.sha;
    if (sha === S.head && !force && Object.keys(S.files).length) { done(); return; }
    const tr = await gh(`/repos/${cfg.repo}/git/trees/${sha}?recursive=1`);
    if (!tr.ok) throw erro('http', 'tree ' + tr.status);
    const next = {};
    for (const e of tr.json.tree) if (e.type === 'blob' && incluir(e.path)) next[e.path] = e.sha;
    const fresh = p => (S.wrote[p] || 0) >= t0;
    const changed = Object.keys(next).filter(p => (!S.files[p] || S.files[p].sha !== next[p]) && !fresh(p));
    const removed = Object.keys(S.files).filter(p => !(p in next) && !fresh(p));
    await pool(changed, 6, async p => { S.files[p] = parseFile(p, next[p], await getBlob(next[p])); });
    for (const p of removed) delete S.files[p];
    const prev = S.head;
    S.head = sha;
    const cm = await gh(`/repos/${cfg.repo}/commits?sha=${encodeURIComponent(cfg.branch)}&per_page=20`);
    if (cm.ok && Array.isArray(cm.json)) S.commits = cm.json.map(c => ({ sha: c.sha, msg: c.commit.message, date: c.commit.author?.date || c.commit.committer?.date }));
    reindex(); saveSnap();
    if (changed.length || removed.length) gcBlobs();
    done();
    render();
    if (prev && prev !== sha) announce(prev, [...changed, ...removed]);
  } catch (e) {
    S.err = e.code || 'http';
    if (e.code === 'token') { showSetup('O GitHub recusou o token. Gere outro e cole aqui.'); }
    else if (e.code === 'notfound') { showSetup('Não achei o repositório com esse token. Confira o nome e se o token tem acesso a ele.'); }
  } finally {
    S.syncing = false; setLive();
    if (S.resync) { S.resync = false; setTimeout(() => sync(), 300); }
  }
}

/* ─────────────── gravação ─────────────── */
function prefixo(p) {
  if (p === 'inbox.md') return 'inbox';
  if (p === 'tarefas.md') return 'tarefas';
  if (p === 'agenda.md') return 'agenda';
  if (p === COMPRAS) return 'compras';
  if (p.startsWith('casos/')) return p.slice(6).replace(/\.md$/, '');
  const a = p.match(/^areas\/([^/]+)\//); if (a) return a[1];
  for (const d of ['pessoas', 'diario', 'documentos', 'eu']) if (p.startsWith(d + '/')) return d;
  return 'notas';
}
function commitMsg(path, txt) {
  const f = S.files[path];
  if (f && f.sens) return `${f.area === 'eu' ? 'eu' : f.area}: registro atualizado`;
  return `${prefixo(path)}: ${txt}`;
}
function carimbar(text) {
  if (!/^---\r?\n/.test(text)) return text;
  const end = text.indexOf('\n---', 4);
  if (end < 0) return text;
  const fm = text.slice(0, end);
  if (!/^atualizado:/m.test(fm)) return text;
  return fm.replace(/^atualizado:.*$/m, 'atualizado: ' + ymd(now())) + text.slice(end);
}
function write(path, transform, message, { onOk, onErr } = {}) {
  S.pending++; setLive();
  const job = queue.then(() => doWrite(path, transform, message))
    .then(r => { onOk && onOk(r); }, e => { onErr ? onErr(e) : toastErr(e); })
    .finally(() => { S.pending--; setLive(); render(); });
  queue = job.catch(() => { });
  return job;
}
async function doWrite(path, transform, message) {
  const f = S.files[path];
  let base = f ? f.text : null, sha = f ? f.sha : undefined;
  for (let i = 0; i < 3; i++) {
    let out = transform(base);
    if (out == null) throw erro('sumiu');
    out = carimbar(out);

function dialSvg(items, nm, dow) {
  const C = 180, Rt = 160, Rb = 147, lanes = [131, 118, 105];
  const ang = m => (m / 1440) * Math.PI * 2 - Math.PI / 2;
  const pt = (r, m) => [C + r * Math.cos(ang(m)), C + r * Math.sin(ang(m))];
  const arc = (r, a, b) => {
    b = Math.min(b, a + 1439.5);
    const [x1, y1] = pt(r, a), [x2, y2] = pt(r, b);
    return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${b - a > 720 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };
  let s = '';
  for (let hh = 0; hh < 24; hh++) {
    const mj = hh % 6 === 0, [x1, y1] = pt(mj ? Rt - 6 : Rt - 2.5, hh * 60), [x2, y2] = pt(Rt + 3, hh * 60);
    s += `<line class="tk${mj ? ' mj' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if (mj) { const [lx, ly] = pt(Rt + 14, hh * 60); s += `<text class="hl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}">${hh}h</text>`; }
  }
  s += `<circle class="trk" cx="${C}" cy="${C}" r="${Rb}"/>`;
  const ex = EXPEDIENTE[dow];
  if (ex) s += `<path class="exp" d="${arc(Rb + 6, ex[0] * 60, ex[1] * 60)}"><title>Expediente</title></path>`;
  s += `<path class="elp" d="${arc(Rb, 0, Math.max(nm, 2))}"/>`;
  const laneEnd = [-1, -1, -1];
  for (const it of items) {
    const a = toMin(it.start), b = Math.max(toMin(it.end), a + 6);
    let ln = laneEnd.findIndex(e => e <= a);
    if (ln < 0) ln = laneEnd.indexOf(Math.min(...laneEnd));
    laneEnd[ln] = b;
    const cls = b <= nm ? 'past' : a <= nm ? 'cur' : '';
    s += `<path class="ev ${cls}" stroke="${areaColor(it.area)}" d="${arc(lanes[ln], a + 2, b - 2)}"><title>${h(`${it.start}–${it.end} ${itemName(it)}`)}</title></path>`;
  }
  const [ix, iy] = pt(lanes[2] - 12, nm), [ox, oy] = pt(Rt + 3, nm), [nx, ny] = pt(Rb, nm);
  s += `<line class="hand" x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}"/>`;
  s += `<circle class="halo" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="6"/><circle class="now" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="5.5"/>`;
  return s;
}

function renderRhythm() {
  const n = now(), days = [];

  }

    onErr(err) {
      $('#drSave').disabled = false;
      if (err.code === 'mudou') {
        $('#drMsg').innerHTML = `${MSGS.mudou} Vocês mexeram no mesmo trecho. <button class="btn ghost" id="drReload" type="button" style="height:28px;margin-left:6px">Ver a versão nova</button><button class="btn ghost" id="drForce" type="button" style="height:28px;margin-left:6px">Salvar a minha por cima</button>`;
        $('#drForce').onclick = () => saveEdit(true);
        $('#drReload').onclick = () => { const mine = $('#ed').value; S.edit = null; $('#drBody').innerHTML = ''; startEdit(); $('#drMsg').textContent = 'Versão nova carregada. Sua versão foi copiada; cole se precisar.'; try { navigator.clipboard.writeText(mine); } catch { } };
      } else $('#drMsg').textContent = MSGS[err.code] || 'Não salvei: o GitHub respondeu com erro.';
    },
  });
}

function diffHunks(a, b) {
  const n = a.length, m = b.length;
  let p = 0; while (p < n && p < m && a[p] === b[p]) p++;
  let q = 0; while (q < n - p && q < m - p && a[n - 1 - q] === b[m - 1 - q]) q++;
  const A = a.slice(p, n - q), B = b.slice(p, m - q), N = A.length, M = B.length;
  if (!N && !M) return [];
  if (N * M > 2e6) return [{ s: p, e: n - q, lines: B }];
  const dp = Array.from({ length: N + 1 }, () => new Uint32Array(M + 1));
  for (let i = N - 1; i >= 0; i--) for (let j = M - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0, cur = null;
  while (i < N || j < M) {
    if (i < N && j < M && A[i] === B[j]) { if (cur) { out.push(cur); cur = null; } i++; j++; }
    else if (j < M && (i >= N || dp[i][j + 1] >= dp[i + 1][j])) { if (!cur) cur = { s: p + i, e: p + i, lines: [] }; cur.lines.push(B[j++]); }
    else { if (!cur) cur = { s: p + i, e: p + i, lines: [] }; i++; cur.e = p + i; }
  }
  if (cur) out.push(cur);
  return out;
}
function merge3(base, mine, theirs) {
  const B = base.split('\n');
  const h1 = diffHunks(B, mine.split('\n')), h2 = diffHunks(B, theirs.split('\n'));
  for (const x of h1) for (const y of h2) if (x.s <= y.e && y.s <= x.e) return null;
  for (const hk of [...h1, ...h2].sort((x, y) => y.s - x.s)) B.splice(hk.s, hk.e - hk.s, ...hk.lines);
  return B.join('\n');
}

/* ─────────────── busca ─────────────── */
let findSel = 0, findList = [];
function openFind() { $('#find').hidden = false; $('#findIn').value = ''; doFind(); $('#findIn').focus(); }
function closeFind() { $('#find').hidden = true; }
function doFind() {
  const q = norm($('#findIn').value).trim();
  const terms = q.split(/\s+/).filter(Boolean);
  let res;
  if (!terms.length) {
    res = Object.values(S.files).filter(f => f.meta.atualizado).sort((a, b) => b.meta.atualizado.localeCompare(a.meta.atualizado)).slice(0, 8).map(f => ({ f, sn: plain(f.meta.resumo || '') }));
  } else {
    res = [];
    for (const f of Object.values(S.files)) {
      const nt = norm(f.title), nm = norm([f.meta.resumo, ...(Array.isArray(f.meta.tags) ? f.meta.tags : [f.meta.tags || ''])].join(' '));
      f._n = f._n || f.body.split('\n').map(l => [l, norm(l)]);
      if (!terms.every(t => nt.includes(t) || nm.includes(t) || f._n.some(x => x[1].includes(t)))) continue;
      let sc = 0, best = null, bestN = 0;
      for (const t of terms) { if (nt.includes(t)) sc += 10; if (nm.includes(t)) sc += 4; }
      for (const [l, nl] of f._n) { const c = terms.filter(t => nl.includes(t)).length; if (c) { sc += c; if (c > bestN && l.trim() && !/^#/.test(l)) { bestN = c; best = l; } } }
      res.push({ f, sc, sn: plain(best || f.meta.resumo || '') });
    }
    res.sort((a, b) => b.sc - a.sc);
    res = res.slice(0, 20);
  }
  findList = res; findSel = 0;
  const mark = s => { let x = h(s.replace(/^\s*[-*|>]+\s*/, '').replace(/\s*\|\s*/g, '   ')); for (const t of terms) { if (t.length < 2) continue; const n = norm(x); let out = '', i = 0, k; while ((k = n.indexOf(t, i)) >= 0) { out += x.slice(i, k) + '<mark>' + x.slice(k, k + t.length) + '</mark>'; i = k + t.length; } x = out + x.slice(i); } return x; };
  $('#findRes').innerHTML = res.length ? res.map((r, i) => `<li><button role="option" aria-selected="${i === 0}" data-find="${i}"><span class="rt">${h(plain(r.f.title))}</span><span class="rp">${h(r.f.path)}</span><div class="sn">${r.f.sens && cfg.discreet ? 'Conteúdo reservado' : mark(short(r.sn, 220))}</div></button></li>`).join('') : `<li class="empty" style="padding:14px 12px">Nada encontrado com "${h($('#findIn').value)}".</li>`;
}
function moveFind(d) {
  if (!findList.length) return;
  findSel = (findSel + d + findList.length) % findList.length;
  $$('#findRes button').forEach((b, i) => b.setAttribute('aria-selected', String(i === findSel)));
  $$('#findRes button')[findSel]?.scrollIntoView({ block: 'nearest' });
}

/* ─────────────── ajustes e entrada ─────────────── */
const MARK = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M16 5a11 11 0 0 1 9.5 16.5" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="25.5" cy="21.5" r="3.4" fill="var(--signal)"/></svg>';
function showSetup(msg) {
  $('#app').hidden = true; closeNote(); $('#cfg').hidden = true;
  const s = $('#setup');
  s.hidden = false;
  s.innerHTML = `<div class="box"><div class="mark">${MARK}</div><form class="form" id="setupForm" autocomplete="off">
    <h2>Ligar o painel ao GitHub</h2>
    <p class="hint" style="font-size:14px">O painel lê e grava direto no repositório do assessor. Para isso ele precisa de um token seu, que fica guardado só neste aparelho.</p>
    <ol>
      <li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">github.com/settings/personal-access-tokens/new</a>.</li>
      <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque o repositório do assessor.</li>
      <li>Em <b>Permissions → Repository permissions</b>, mude <b>Contents</b> para <b>Read and write</b>.</li>
      <li>Clique em <b>Generate token</b>, copie e cole aqui embaixo.</li>
    </ol>
    <label for="sRepo">Repositório</label><input id="sRepo" value="${h(cfg.repo)}" spellcheck="false" autocapitalize="off">
    <label for="sTok">Token</label><input id="sTok" type="password" placeholder="github_pat_…" spellcheck="false" autocapitalize="off">
    ${msg ? `<p class="err">${h(msg)}</p>` : ''}<p class="err" id="sErr"></p>
    <div class="row"><button class="btn" type="submit" style="height:42px;padding:0 18px">Conectar</button></div>
  </form></div>`;
  $('#setupForm').onsubmit = async ev => {
    ev.preventDefault();
    const repo = $('#sRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$|\/$/g, '');
    const tok = $('#sTok').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('#sErr').textContent = 'Escreva o repositório como usuario/nome.'; return; }
    if (!tok) { $('#sErr').textContent = 'Cole o token.'; return; }
    const prevTok = cfg.token, prevRepo = cfg.repo;
    cfg.token = tok; cfg.repo = repo; cfg.branch = '';
    $('#sErr').textContent = 'Conferindo…';
    try {
      const r = await gh(`/repos/${repo}`);
      if (r.status === 404) throw erro('notfound');
      if (!r.ok) throw erro('http', String(r.status));
      if (r.json.permissions && r.json.permissions.push === false) { $('#sErr').textContent = 'Conectado, mas o token só lê. Para gravar, gere um com "Contents: Read and write".'; }
      cfg.branch = r.json.default_branch || 'main';
      if (prevRepo !== repo) { S.files = {}; S.head = null; S.commits = []; }
      saveCfg(); start();
    } catch (e) {
      cfg.token = prevTok; cfg.repo = prevRepo;
      $('#sErr').textContent = e.code === 'token' ? 'O GitHub recusou esse token. Confira se copiou inteiro.' : e.code === 'notfound' ? 'Esse token não enxerga o repositório. Confira o nome e o acesso do token.' : e.code === 'offline' ? 'Sem conexão com o GitHub agora.' : 'O GitHub respondeu com erro (' + e.message + ').';
    }
  };
  setTimeout(() => $('#sTok')?.focus(), 50);
}
function showCfg() {
  const o = $('#cfg');
  o.hidden = false;
  o.innerHTML = `<div class="box" role="dialog" aria-label="Ajustes"><form class="form" id="cfgForm">
    <h2>Ajustes</h2>
    <label for="cRepo">Repositório</label><input id="cRepo" value="${h(cfg.repo)}" disabled>
    <label for="cInt">Procurar mudanças no GitHub a cada</label><select id="cInt">${[10, 15, 30, 60].map(s => `<option value="${s}"${cfg.interval === s ? ' selected' : ''}>${s} segundos</option>`).join('')}</select>
    <label for="cTheme">Aparência</label><select id="cTheme"><option value="auto"${cfg.theme === 'auto' ? ' selected' : ''}>Igual ao aparelho</option><option value="light"${cfg.theme === 'light' ? ' selected' : ''}>Clara</option><option value="dark"${cfg.theme === 'dark' ? ' selected' : ''}>Escura</option></select>
    <p class="hint">Token terminado em ${h(cfg.token.slice(-4))}. Ele fica só neste navegador.</p>
    <div class="row"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" id="cClose">Fechar</button><button class="btn ghost" type="button" id="cOut" style="margin-left:auto;color:var(--alert)">Desconectar deste aparelho</button></div>
  </form></div>`;
  $('#cfgForm').onsubmit = ev => { ev.preventDefault(); cfg.interval = +$('#cInt').value; cfg.theme = $('#cTheme').value; saveCfg(); applyTheme(); o.hidden = true; };
  $('#cClose').onclick = () => { o.hidden = true; };
  $('#cOut').onclick = () => {
    cfg.token = ''; cfg.branch = ''; saveCfg();
    for (const k of LS.keys()) if (k.startsWith(K + 'b.') || k === K + 'snap') LS.del(k);
    S.files = {}; S.head = null; S.commits = []; S.etag = null;
    o.hidden = true; showSetup();
  };
  o.onclick = ev => { if (ev.target === o) o.hidden = true; };
  $('#cInt').focus();
}
function applyTheme() {
  const t = cfg.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : cfg.theme;
  document.documentElement.dataset.theme = t;
  $('meta[name="theme-color"]').content = t === 'dark' ? '#17191D' : '#E8EBEF';
}

/* ─────────────── avisos e indicador ─────────────── */
function toast(msg, { err = false, undo, open, html = false } = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.innerHTML = `<span class="tm">${html ? msg : h(msg)}</span>${open ? '<button data-t="open">Ver</button>' : ''}${undo ? '<button data-t="undo">Desfazer</button>' : ''}`;
  const kill = () => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(() => el.remove(), 200); };
  el.addEventListener('click', ev => { const t = ev.target.dataset.t; if (t === 'undo') { undo(); kill(); } if (t === 'open') { openNote(open); kill(); } });
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(kill, err ? 7000 : undo ? 6000 : 4200);
}
function announce(prev, changed) {
  const ext = [];
  for (const c of S.commits) { if (c.sha === prev) break; if (!S.ours.has(c.sha)) ext.push(c); }
  if (!ext.length) return;
  const it = ext.map(feedItem).filter(Boolean);
  const first = changed.find(p => S.files[p] && !S.files[p].sens && p !== 'inicio.md');
  if (it.length) toast(`<b>${h(it[0].label)}</b><small>${h(it[0].txt)}${it.length > 1 ? ` (e mais ${it.length - 1})` : ''}</small>`, { html: true, open: first });
  const secs = new Set(['#secFeed']);
  for (const p of changed) {
    if (p.startsWith('casos/')) secs.add('#secCases');
    if (p.startsWith('areas/')) secs.add('#secAreas');
    if (p === 'agenda.md') secs.add('#secDay');
    if (p === 'inbox.md') secs.add('#secCap');
    if (p === 'eu/habitos.md') secs.add('#secRhythm');
    if (S.files[p]?.tasks.length) secs.add('#secTasks');
  }
  for (const s of secs) { const el = $(s); if (!el) continue; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function setLive() {
  const el = $('#live'), tx = $('#liveTxt');
  if (!el) return;
  let cls = '', t = '';
  if (S.pending) { cls = 'saving'; t = 'salvando…'; }
  else if (S.err === 'offline') { cls = 'err'; t = 'sem conexão'; }
  else if (S.err === 'rate') { cls = 'err'; t = `limite do GitHub até ${hm(new Date(S.rateReset || Date.now() + 6e5))}`; }
  else if (S.err) { cls = 'err'; t = 'erro ao ler o GitHub'; }
  else if (!S.lastSync) { cls = 'idle'; t = 'conectando'; }
  else { const s = Math.round((Date.now() - S.lastSync) / 1000); t = `<b>ao vivo</b><span class="ago">${s < 5 ? '' : ` · há ${s < 60 ? s + ' s' : Math.round(s / 60) + ' min'}`}</span>`; }
  el.className = 'live ' + cls;
  tx.innerHTML = t;
  el.title = S.head ? `Último commit lido: ${S.head.slice(0, 7)}` : '';
}

/* ─────────────── eventos ─────────────── */
function bind() {
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-open],[data-task],[data-compra],[data-compra-undo],[data-tab],[data-inbox],[data-hab],[data-undo],[data-cancel],[data-mdt],[data-reveal],[data-find]');
    if (!t) return;
    const d = t.dataset;
    if (d.open !== undefined) { ev.preventDefault(); closeFind(); openNote(d.open); return; }
    if (d.task) { const g = S.tasks.find(x => x.key === d.task); if (g && !S.opt.has(g.key)) toggleTask(g.key, !isChecked(g)); return; }
    if (d.compra) { if (!S.opt.has('c:' + d.compra)) toggleCompra(d.compra, true, d.sec); return; }
    if (d.compraUndo) { if (!S.opt.has('c:' + d.compraUndo)) toggleCompra(d.compraUndo, false); return; }
    if (d.tab) { S.tab = d.tab; renderTasks(); $(`[data-tab="${d.tab}"]`).focus(); return; }
    if (d.inbox) { delInbox(d.inbox); return; }
    if (d.hab) { const b = S._todayIdx[d.hab]; if (!b) return; if (d.ok === '1') markHabit(b, true); else { S.askWhy = d.hab; renderDay(); } return; }
    if (d.cancel !== undefined) { S.askWhy = null; renderDay(); return; }
    if (d.undo) { const b = S._todayIdx[d.undo]; const rec = b && habitRecord(b, ymd(now())); if (rec) undoHabit(rec, b); return; }
    if (d.mdt) {
      const m = mdTasks[+d.mdt]; if (!m) return;
      const tm = m.raw.match(TASK_RE), tid = (tm[3].match(/🆔\s*(\S+)/) || [])[1];
      const key = tid ? 'id:' + tid : m.path + '\n' + m.raw;
      const g = S.tasks.find(x => x.key === key);
      if (g && !S.opt.has(key)) toggleTask(key, !isChecked(g));
      else if (!g && m.path === COMPRAS && !S.opt.has('c:' + m.raw)) toggleCompra(m.raw, tm[2] === ' ', '');
      return;
    }
    if (d.reveal) { S.reveal.add(d.reveal); renderDrawer(); return; }
    if (d.find) { const r = findList[+d.find]; if (r) { closeFind(); openNote(r.f.path); } return; }
  });
  document.addEventListener('submit', ev => {
    const f = ev.target;
    if (f.matches('form[data-why]')) { ev.preventDefault(); const b = S._todayIdx[f.dataset.why]; if (b) markHabit(b, false, f.querySelector('input').value); }
  });
  $('#addTask').addEventListener('submit', ev => {
    ev.preventDefault();
    const txt = $('#addTxt').value.trim(); if (!txt) return;
    if (S.tab === 'compras') addCompra(txt, $('#addSec').value);
    else { addTask(txt, $('#addDue').value || ''); $('#addDue').value = ''; }
    $('#addTxt').value = '';
  });
  $('#capForm').addEventListener('submit', ev => { ev.preventDefault(); const v = $('#capTxt').value.trim(); if (!v) return; addInbox(v.replace(/\s*\n+\s*/g, ' / ')); $('#capTxt').value = ''; });
  $('#capTxt').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('#capForm').requestSubmit(); } });
  $('#fab').onclick = () => { $('#secCap').scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => $('#capTxt').focus(), 350); };
  $('#eye').onclick = () => { cfg.discreet = !cfg.discreet; saveCfg(); S.reveal.clear(); render(); };
  $('#openCfg').onclick = showCfg;
  $('#openFind').onclick = openFind;
  $('#find').addEventListener('click', ev => { if (ev.target.id === 'find') closeFind(); });
  $('#findIn').addEventListener('input', doFind);
  $('#findIn').addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveFind(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveFind(-1); }
    else if (ev.key === 'Enter') { const r = findList[findSel]; if (r) { closeFind(); openNote(r.f.path); } }
  });
  $('#drClose').onclick = closeNote;
  $('#scrim').onclick = closeNote;
  $('#drEdit').onclick = startEdit;
  $('#drCancel').onclick = () => { S.edit = null; $('#drBody').innerHTML = ''; renderDrawer(); };
  $('#drSave').onclick = () => saveEdit(false);
  $('#drBody').addEventListener('input', ev => { if (ev.target.id === 'ed' && S.edit) { S.edit.text = ev.target.value; S.edit.dirty = true; S.edit.confirmClose = false; $('#drMsg').textContent = ''; } });
  $('#drBody').addEventListener('keydown', ev => { if (ev.target.id === 'ed' && (ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); saveEdit(false); } });
  document.addEventListener('keydown', ev => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('#find').hidden ? openFind() : closeFind(); return; }
    if (ev.key === '/' && !typing && $('#find').hidden && !$('#app').hidden) { ev.preventDefault(); openFind(); return; }
    if (ev.key === 'Escape') {
      if (!$('#find').hidden) closeFind();
      else if (!$('#cfg').hidden) $('#cfg').hidden = true;
      else if (S.askWhy) { S.askWhy = null; renderDay(); }
      else if (S.open) closeNote();
    }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => cfg.theme === 'auto' && applyTheme());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.lastTry > 4000) sync(); });
  addEventListener('online', () => sync());
}

function tick() {
  const n = now();
  const ck = $('#clock'), ckt = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  if (ck && ck.dataset.t !== ckt) { ck.dataset.t = ckt; ck.innerHTML = `${pad(n.getHours())}<span class="col">:</span>${pad(n.getMinutes())}`; }
  if ($('#app').hidden) return;
  const m = n.getHours() * 60 + n.getMinutes();
  if (ymd(n) !== S.day) render();
  else if (m !== S.minute && !document.activeElement?.closest?.('form[data-why]')) { renderDay(); renderFeed(); }
  setLive();
  if (!cfg.token || S.syncing || document.visibilityState !== 'visible') return;
  let wait = cfg.interval * 1000;
  if (S.err === 'offline' || S.err === 'http') wait = Math.max(wait, 30000);
  if (S.err === 'rate') wait = Math.max(30000, (S.rateReset || 0) - Date.now());
  if (Date.now() - S.lastTry >= wait) sync();
}

function start() {
  $('#setup').hidden = true;
  $('#app').hidden = false;
  if (loadSnap()) reindex();
  render();
  sync(true);
}

applyTheme();
bind();
setInterval(tick, 1000);
tick();
if (cfg.token) start(); else showSetup();
})();
</script>
